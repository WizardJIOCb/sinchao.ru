# Keep the existing site reachable while the canonical domain is propagating.
server {
    listen 80;
    listen [::]:80;
    server_name sinchao.online www.sinchao.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sinchao.ru/acme;
        default_type text/plain;
    }
    location / { return 302 https://food.xedoc.ru$request_uri; }
}
