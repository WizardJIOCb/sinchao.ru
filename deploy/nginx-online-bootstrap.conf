# Only ACME is available until the canonical site and this alias have HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sinchao.online www.sinchao.online;
    add_header Retry-After 300 always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sinchao.ru/acme;
        default_type text/plain;
    }
    location / { return 503; }
}
