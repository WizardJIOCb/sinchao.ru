server {
    listen 80;
    listen [::]:80;
    server_name sinchao.online www.sinchao.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sinchao.ru/acme;
        default_type text/plain;
    }
    location / { return 308 https://sinchao.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sinchao.online www.sinchao.online;
    ssl_certificate /etc/letsencrypt/live/sinchao.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinchao.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://sinchao.ru$request_uri;
}
