server {
    listen 80;
    listen [::]:80;
    server_name sinchao.ru www.sinchao.ru;
    client_max_body_size 200k;
    access_log /var/log/nginx/food-sinchao.access.log;
    error_log /var/log/nginx/food-sinchao.error.log;
    # Keep configuration and version-control paths away from the SPA fallback.
    location ~* (^|/)(\.env[^/]*|\.(git|svn|hg|ssh|aws)(/|$)|\.(git-credentials|netrc|pgpass|htpasswd)(/|$)) {
        return 404;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sinchao.ru/acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:3187;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
